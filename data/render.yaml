services:
  - type: web
    name: prompt-ai-data
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false          # set in the Render dashboard, never committed
      - key: API_SHARED_SECRET
        sync: false          # must match API_SHARED_SECRET in /api
      - key: PYTHON_VERSION
        value: 3.11.9
    healthCheckPath: /health
