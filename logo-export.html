<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    body { display: inline-flex; }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 50px; /* 10px gap scaled for 160px icon (component uses gap-2.5 at 32px) */
      padding: 0;
    }
    .wordmark {
      font-family: 'Geist', sans-serif;
      font-size: 80px; /* size * 0.5, size = 160 */
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1;
      color: #000000; /* "Prompt" in black */
      white-space: nowrap;
    }
    .wordmark .ai { color: #F2A93B; } /* "AI" stays yellow */
  </style>
</head>
<body>
  <span class="logo" aria-label="Prompt AI">
    <svg width="160" height="160" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="#111113" stroke="#232327" stroke-width="1" />
      <text x="5" y="20" font-family="'Geist Mono', monospace" font-size="12" font-weight="600" fill="#F2A93B">&gt;</text>
      <text x="14" y="20" font-family="'Geist Mono', monospace" font-size="12" font-weight="400" fill="#EDEDEF">_</text>
      <rect x="14" y="21" width="8" height="2" rx="1" fill="#F2A93B" opacity="0.7" />
    </svg>
    <span class="wordmark">Prompt<span class="ai">AI</span></span>
  </span>
</body>
</html>
